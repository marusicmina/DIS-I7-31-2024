server:
  port: 8085
  error:
    include-message: always

spring:
  application:
    name: booking-service

  datasource:
    # Podrazumevane vrednosti vaze SAMO za lokalno pokretanje iz IDE-a (baza je
    # kroz docker-compose mapirana na host port 5437). Unutar Docker-a
    # docker-compose postavlja BOOKING_DB_HOST=booking-db i BOOKING_DB_PORT=5432.
    url: jdbc:postgresql://${BOOKING_DB_HOST:localhost}:${BOOKING_DB_PORT:5437}/${BOOKING_DB_NAME:bookingdb}
    username: ${BOOKING_DB_USER:booking}
    password: ${BOOKING_DB_PASSWORD:booking}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  cloud:
    config:
      enabled: false

eureka:
  client:
    enabled: true
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registryFetchIntervalSeconds: 5
    initialInstanceInfoReplicationIntervalSeconds: 5
  instance:
    preferIpAddress: true
    leaseRenewalIntervalInSeconds: 5
    leaseExpirationDurationInSeconds: 10

# --- Otpornost na otkaze zavisnih servisa ---
resilience4j:
  circuitbreaker:
    configs:
      default:
        # Posmatramo poslednjih 10 poziva; ako vise od pola padne, otvaramo kolo.
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        # Kolo ostaje otvoreno 10s, pa propusta 3 probna poziva da vidi
        # da li se servis oporavio.
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        registerHealthIndicator: true
        # 404 nije kvar servisa nego legitiman odgovor - ne sme da otvara kolo.
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException$NotFound
          - com.salonbooking.util.exceptions.NotFoundException
    instances:
      salonService:
        baseConfig: default
      catalogService:
        baseConfig: default
      staffService:
        baseConfig: default

  retry:
    configs:
      default:
        # Ukupno 3 pokusaja sa 200ms pauze - pokriva kratke mrezne smetnje.
        # Vise od toga bi samo produzilo cekanje klijenta.
        maxAttempts: 3
        waitDuration: 200ms
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
          - java.io.IOException
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException$NotFound
          - com.salonbooking.util.exceptions.NotFoundException
    instances:
      salonService:
        baseConfig: default
      catalogService:
        baseConfig: default
      staffService:
        baseConfig: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.salonbooking: DEBUG
