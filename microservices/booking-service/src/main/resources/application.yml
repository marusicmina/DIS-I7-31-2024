server:
  port: 8085
  error:
    include-message: always

spring:
  application:
    name: booking-service

  datasource:
    url: jdbc:postgresql://${BOOKING_DB_HOST:localhost}:${BOOKING_DB_PORT:5437}/${BOOKING_DB_NAME:bookingdb}
    username: ${BOOKING_DB_USER:booking}
    password: ${BOOKING_DB_PASSWORD:booking}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

  cloud:
    stream:
      bindings:
        bookingEvents-out-0:
          destination: booking-events
          producer:
            partition-key-expression: headers['partitionKey']
      kafka:
        binder:
         
          brokers: ${KAFKA_BROKERS:localhost:29092}
          auto-create-topics: true

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:29092}

eureka:
  client:
    enabled: true
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registryFetchIntervalSeconds: 5
    initialInstanceInfoReplicationIntervalSeconds: 5
  instance:
    preferIpAddress: true
    leaseRenewalIntervalInSeconds: 5
    leaseExpirationDurationInSeconds: 10

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        registerHealthIndicator: true
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException$NotFound
          - com.salonbooking.util.exceptions.NotFoundException
    instances:
      salonService:
        baseConfig: default
      catalogService:
        baseConfig: default
      staffService:
        baseConfig: default

  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 200ms
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
          - java.io.IOException
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException$NotFound
          - com.salonbooking.util.exceptions.NotFoundException
    instances:
      salonService:
        baseConfig: default
      catalogService:
        baseConfig: default
      staffService:
        baseConfig: default
