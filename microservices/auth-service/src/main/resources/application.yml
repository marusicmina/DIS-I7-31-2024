server:
  port: 8082
  error:
    include-message: always

spring:
  application:
    name: auth-service

  datasource:
    # Podrazumevane vrednosti vaze SAMO za lokalno pokretanje iz IDE-a, kada baza
    # radi kroz docker-compose i mapirana je na host port 5434 (5432 je zauzet
    # lokalnim Postgres-om). Kada servis radi unutar Docker-a, docker-compose
    # postavlja AUTH_DB_HOST=auth-db i AUTH_DB_PORT=5432 i pregazi ove vrednosti.
    url: jdbc:postgresql://${AUTH_DB_HOST:localhost}:${AUTH_DB_PORT:5434}/${AUTH_DB_NAME:authdb}
    username: ${AUTH_DB_USER:auth}
    password: ${AUTH_DB_PASSWORD:auth}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # Povuci zajednicku konfiguraciju sa config-servera.
  # "optional:" znaci da servis radi i ako config-server nije pokrenut.
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

jwt:
  # VAZNO: ovo je samo dev/test podrazumevana vrednost. U produkciji se MORA
  # postaviti JWT_SECRET env varijabla na nasumican, dovoljno dugacak string
  # (minimum 32 karaktera za HS256) i ne sme se cuvati u git repozitorijumu.
  secret: ${JWT_SECRET:salon-booking-system-dev-secret-change-me-please-32chars-min}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

eureka:
  client:
    enabled: true
    serviceUrl:
      # Lokalno iz IDE-a: Eureka na localhost. U Docker-u: docker-compose
      # postavlja EUREKA_URL na http://eureka-server:8761/eureka/
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    # Kraci intervali nego podrazumevani (30s) - u razvoju hocemo da servis
    # osvane u registru za par sekundi, a ne za pola minuta.
    registryFetchIntervalSeconds: 5
    initialInstanceInfoReplicationIntervalSeconds: 5
  instance:
    # Registruj se preko IP adrese umesto hostname-a; u Docker-u je to pouzdanije.
    preferIpAddress: true
    leaseRenewalIntervalInSeconds: 5
    leaseExpirationDurationInSeconds: 10
