
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        registerHealthIndicator: true
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException$NotFound
          - com.salonbooking.util.exceptions.NotFoundException
    instances:
      salonService:
        baseConfig: default
      catalogService:
        baseConfig: default
      staffService:
        baseConfig: default

  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 200ms
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
          - java.io.IOException
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException$NotFound
          - com.salonbooking.util.exceptions.NotFoundException
    instances:
      salonService:
        baseConfig: default
      catalogService:
        baseConfig: default
      staffService:
        baseConfig: default
