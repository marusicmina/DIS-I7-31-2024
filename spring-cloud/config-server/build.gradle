buildscript {
    repositories { mavenCentral() }
    dependencies {
        classpath("org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}")
        classpath("io.spring.gradle:dependency-management-plugin:1.1.6")
    }
}

apply plugin: 'org.springframework.boot'
apply plugin: 'io.spring.dependency-management'

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    implementation 'org.springframework.cloud:spring-cloud-config-server'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

// Konfiguracioni fajlovi zive u /config-repo u korenu projekta - jedan izvor istine.
// Ovde ih kopiramo u JAR, da config-server radi i kad se pokrene iz IDE-a,
// bez zavisnosti od radnog direktorijuma. U Docker-u se isti folder montira
// kao volumen, pa se konfiguracija menja bez ponovnog build-a.
processResources {
    from("${rootDir}/config-repo") {
        into 'config-repo'
    }
}

test {
    useJUnitPlatform()
}
