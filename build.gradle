// Root build fajl - zajednicka podesavanja za sve module (api, util, microservices/*, spring-cloud/*).
// Svaki modul dodatno primenjuje Spring Boot / Spring Cloud plugin u svom build.gradle (buildscript stil,
// preuzeto sa mavenCentral, bez oslanjanja na Gradle Plugin Portal).

allprojects {
    group = 'com.salonbooking'
    version = '1.0.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    test {
        useJUnitPlatform()
    }
}
