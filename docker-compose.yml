
services:

  eureka-server:
    build:
      context: ./spring-cloud/eureka-server
    container_name: eureka-server
    environment:
      EUREKA_HOSTNAME: eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  config-server:
    build:
      context: ./spring-cloud/config-server
    container_name: config-server
    environment:
      
      CONFIG_REPO_LOCATION: file:/config-repo/
      EUREKA_URL: http://eureka-server:8761/eureka/
    volumes:
      - ./config-repo:/config-repo:ro
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      eureka-server:
        condition: service_healthy

  salon-db:
    image: postgres:16-alpine
    container_name: salon-db
    environment:
      POSTGRES_DB: salondb
      POSTGRES_USER: salon
      POSTGRES_PASSWORD: salon
    ports:
      - "5433:5432"
    volumes:
      - salon-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salon -d salondb"]
      interval: 5s
      timeout: 5s
      retries: 10

  salon-service:
    build:
      context: ./microservices/salon-service
    container_name: salon-service
    environment:
      SALON_DB_HOST: salon-db
      SALON_DB_PORT: 5432
      SALON_DB_NAME: salondb
      SALON_DB_USER: salon
      SALON_DB_PASSWORD: salon
      EUREKA_URL: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
    ports:
      - "8081:8081"
    depends_on:
      salon-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
    ports:
      - "5434:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d authdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: ./microservices/auth-service
    container_name: auth-service
    environment:
      AUTH_DB_HOST: auth-db
      AUTH_DB_PORT: 5432
      AUTH_DB_NAME: authdb
      AUTH_DB_USER: auth
      AUTH_DB_PASSWORD: auth
      JWT_SECRET: ${JWT_SECRET:-salon-booking-system-dev-secret-change-me-please-32chars-min}
      EUREKA_URL: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
    ports:
      - "8082:8082"
    depends_on:
      auth-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

  catalog-db:
    image: postgres:16-alpine
    container_name: catalog-db
    environment:
      POSTGRES_DB: catalogdb
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
    ports:
      - "5435:5432"
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalogdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  catalog-service:
    build:
      context: ./microservices/catalog-service
    container_name: catalog-service
    environment:
      CATALOG_DB_HOST: catalog-db
      CATALOG_DB_PORT: 5432
      CATALOG_DB_NAME: catalogdb
      CATALOG_DB_USER: catalog
      CATALOG_DB_PASSWORD: catalog
      EUREKA_URL: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
    ports:
      - "8083:8083"
    depends_on:
      catalog-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

  staff-db:
    image: postgres:16-alpine
    container_name: staff-db
    environment:
      POSTGRES_DB: staffdb
      POSTGRES_USER: staff
      POSTGRES_PASSWORD: staff
    ports:
      - "5436:5432"
    volumes:
      - staff-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staff -d staffdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  staff-service:
    build:
      context: ./microservices/staff-service
    container_name: staff-service
    environment:
      STAFF_DB_HOST: staff-db
      STAFF_DB_PORT: 5432
      STAFF_DB_NAME: staffdb
      STAFF_DB_USER: staff
      STAFF_DB_PASSWORD: staff
      EUREKA_URL: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
    ports:
      - "8084:8084"
    depends_on:
      staff-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

  booking-db:
    image: postgres:16-alpine
    container_name: booking-db
    environment:
      POSTGRES_DB: bookingdb
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
    ports:
      - "5437:5432"
    volumes:
      - booking-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d bookingdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  booking-service:
    build:
      context: ./microservices/booking-service
    container_name: booking-service
    environment:
      BOOKING_DB_HOST: booking-db
      BOOKING_DB_PORT: 5432
      BOOKING_DB_NAME: bookingdb
      BOOKING_DB_USER: booking
      BOOKING_DB_PASSWORD: booking
      EUREKA_URL: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      KAFKA_BROKERS: kafka:9092
    ports:
      - "8085:8085"
    depends_on:
      booking-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      kafka:
        condition: service_healthy

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  notification-service:
    build:
      context: ./microservices/notification-service
    container_name: notification-service
    environment:
      KAFKA_BROKERS: kafka:9092
      EUREKA_URL: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
    ports:
      - "8086:8086"
    depends_on:
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

  gateway:
    build:
      context: ./spring-cloud/gateway
    container_name: gateway
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

volumes:
  salon-db-data:
  auth-db-data:
  catalog-db-data:
  staff-db-data:
  booking-db-data:
