# Docker Compose za razvojno (dev) okruzenje.
# Napomena: projekat se gradi deo po deo - ovde su za sada samo komponente
# koje su vec implementirane (salon-service, auth-service). Ostali servisi
# (booking, review, notification, config-server, gateway, kafka) dodaju se
# u narednim delovima projekta.
#
# Pre "docker compose up --build" pokreni "./gradlew build" da se generisu
# JAR fajlovi (build/libs/*.jar) koje Dockerfile-ovi kopiraju u image.

services:

  eureka-server:
    build:
      context: ./spring-cloud/eureka-server
    container_name: eureka-server
    environment:
      EUREKA_HOSTNAME: eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  salon-db:
    image: postgres:16-alpine
    container_name: salon-db
    environment:
      POSTGRES_DB: salondb
      POSTGRES_USER: salon
      POSTGRES_PASSWORD: salon
    ports:
      - "5433:5432"
    volumes:
      - salon-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salon -d salondb"]
      interval: 5s
      timeout: 5s
      retries: 10

  salon-service:
    build:
      context: ./microservices/salon-service
    container_name: salon-service
    environment:
      SALON_DB_HOST: salon-db
      SALON_DB_PORT: 5432
      SALON_DB_NAME: salondb
      SALON_DB_USER: salon
      SALON_DB_PASSWORD: salon
      EUREKA_URL: http://eureka-server:8761/eureka/
    ports:
      - "8081:8081"
    depends_on:
      salon-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
    ports:
      - "5434:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d authdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: ./microservices/auth-service
    container_name: auth-service
    environment:
      AUTH_DB_HOST: auth-db
      AUTH_DB_PORT: 5432
      AUTH_DB_NAME: authdb
      AUTH_DB_USER: auth
      AUTH_DB_PASSWORD: auth
      # VAZNO: u produkciji postaviti pravu tajnu vrednost (npr. kroz .env fajl koji NIJE u git-u).
      JWT_SECRET: ${JWT_SECRET:-salon-booking-system-dev-secret-change-me-please-32chars-min}
      EUREKA_URL: http://eureka-server:8761/eureka/
    ports:
      - "8082:8082"
    depends_on:
      auth-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  catalog-db:
    image: postgres:16-alpine
    container_name: catalog-db
    environment:
      POSTGRES_DB: catalogdb
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
    ports:
      - "5435:5432"
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalogdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  catalog-service:
    build:
      context: ./microservices/catalog-service
    container_name: catalog-service
    environment:
      CATALOG_DB_HOST: catalog-db
      CATALOG_DB_PORT: 5432
      CATALOG_DB_NAME: catalogdb
      CATALOG_DB_USER: catalog
      CATALOG_DB_PASSWORD: catalog
      EUREKA_URL: http://eureka-server:8761/eureka/
    ports:
      - "8083:8083"
    depends_on:
      catalog-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  staff-db:
    image: postgres:16-alpine
    container_name: staff-db
    environment:
      POSTGRES_DB: staffdb
      POSTGRES_USER: staff
      POSTGRES_PASSWORD: staff
    ports:
      - "5436:5432"
    volumes:
      - staff-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staff -d staffdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  staff-service:
    build:
      context: ./microservices/staff-service
    container_name: staff-service
    environment:
      STAFF_DB_HOST: staff-db
      STAFF_DB_PORT: 5432
      STAFF_DB_NAME: staffdb
      STAFF_DB_USER: staff
      STAFF_DB_PASSWORD: staff
      EUREKA_URL: http://eureka-server:8761/eureka/
    ports:
      - "8084:8084"
    depends_on:
      staff-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

volumes:
  salon-db-data:
  auth-db-data:
  catalog-db-data:
  staff-db-data:
